---
kind: pipeline
name: AS IMAP Tests

steps:
  - name: test
    # NOTE: Keep this version in sync with .python-version
    image: "python:3.13.12"
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /drone/src

      UV_LINK_MODE: copy
      DEBUG: true
    commands:
      - pip install uv
      - uv sync --frozen
      - uv run mypy asimap/
      - uv run pytest

---
kind: pipeline
name: Build linux/amd64

# Each architecture builds natively on a runner of that architecture and
# pushes one tag per target.  'Publish multi-arch manifests' joins them under
# the release tags.
platform:
  os: linux
  arch: amd64

depends_on:
  - AS IMAP Tests

steps:
  - name: Build prod
    image: plugins/docker
    settings:
      username:
        from_secret: GHCR_USER
      password:
        from_secret: GHCR_PAT
      repo: ghcr.io/scanner/asimap
      registry: ghcr.io
      tags:
        - ${DRONE_TAG}-linux-amd64
      target: prod
      build_args:
        # NOTE: Keep PYTHON_VERSION in sync with .python-version
        - PYTHON_VERSION=3.13.12
        - VERSION=${DRONE_TAG}

  - name: Build dev
    image: plugins/docker
    settings:
      username:
        from_secret: GHCR_USER
      password:
        from_secret: GHCR_PAT
      repo: ghcr.io/scanner/asimap
      registry: ghcr.io
      tags:
        - ${DRONE_TAG}-dev-linux-amd64
      target: dev
      build_args:
        # NOTE: Keep PYTHON_VERSION in sync with .python-version
        - PYTHON_VERSION=3.13.12
        - VERSION=${DRONE_TAG}

trigger:
  event:
    - tag

---
kind: pipeline
name: Build linux/arm64

# Each architecture builds natively on a runner of that architecture and
# pushes one tag per target.  'Publish multi-arch manifests' joins them under
# the release tags.
platform:
