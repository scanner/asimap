steps:
  - name: Build prod
    image: plugins/docker
    settings:
      username:
        from_secret: GHCR_USER
      password:
        from_secret: GHCR_PAT
      repo: ghcr.io/scanner/asimap
      registry: ghcr.io
      tags:
